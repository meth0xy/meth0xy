ent</text><text x="784" y="123" class="value" text-anchor="end">500+</text><path d="M412 136.5H784" stroke="#262626"/><text x="412" y="159" class="label">Developer hours saved</text><text x="784" y="159" class="value" text-anchor="end">420+</text><path d="M412 172.5H784" stroke="#262626"/><text x="412" y="195" class="label">Internal tools, used company-wide</text><text x="784" y="195" class="value" text-anchor="end">~200 staff</text></svg>
